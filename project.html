<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Thomas ROBERT</title>
  <meta name="description" content="Project detail — portfolio of Thomas ROBERT, engineering student at Arts et Métiers.">

  <!-- Évite le clignotement anglais → français au chargement (voir js/i18n.js) -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('lang');
        var l = q || localStorage.getItem('portfolio-lang');
        if (l && l !== 'en') {
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('data-lang-loading', '');
        }
      } catch (e) { /* localStorage indisponible : on reste en anglais */ }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Hind+Guntur:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="cursor" aria-hidden="true">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
  </div>
  <canvas id="trail-canvas" aria-hidden="true"></canvas>

  <!-- ===================== NAVIGATION ===================== -->
  <header class="nav" id="nav">
    <a href="index.html#home" class="nav-logo">TR<span>.</span></a>

    <nav class="nav-links" id="nav-links">
      <a href="index.html#home" data-i18n="nav.home">Home</a>
      <a href="index.html#journey" data-i18n="nav.journey">Journey</a>
      <a href="index.html#projects" class="is-active" data-i18n="nav.projects">Projects</a>
      <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
      <div class="lang-switch lang-switch-mobile" data-lang-switch></div>
    </nav>

    <div class="nav-right">
      <div class="lang-switch lang-switch-desktop" data-lang-switch></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Open the menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ===================== EN-TÊTE DU PROJET (fond nuit) ===================== -->
    <section class="pd-hero" id="project-top">
      <canvas id="stars-canvas" aria-hidden="true"></canvas>
      <div class="hero-vignette" aria-hidden="true"></div>
      <div class="pd-hero-content" id="pd-hero">
        <!-- rempli par js/project-page.js -->
      </div>
    </section>

    <!-- ===================== CORPS DU PROJET (fond papier) ===================== -->
    <section class="pd-section">
      <div class="pd-cover" id="pd-cover"></div>

      <div class="pd-layout">
        <aside class="pd-aside" id="pd-aside"></aside>
        <div class="pd-body" id="pd-body"></div>
      </div>

      <nav class="pd-pager" id="pd-pager" aria-label="Projects"></nav>
    </section>
  </main>

  <!-- ===================== CONTACT / FOOTER ===================== -->
  <section class="contact-section" id="contact">
    <canvas id="stars-canvas-3" aria-hidden="true"></canvas>

    <div class="contact-content reveal">
      <p class="eyebrow eyebrow-alt" data-i18n="contact.eyebrow">Contact</p>
      <h2 class="contact-title" data-i18n="contact.title">Get in touch</h2>

      <div class="contact-links">
        <a href="mailto:thomas.robert@ensam.eu" class="contact-link">
          <span data-i18n="contact.email">E-mail</span>thomas.robert@ensam.eu
        </a>
        <a href="https://www.linkedin.com/in/votre-profil/" class="contact-link" target="_blank" rel="noopener">
          <span>LinkedIn</span>linkedin.com/in/votre-profil
        </a>
        <a href="https://github.com/votre-pseudo" class="contact-link" target="_blank" rel="noopener">
          <span>GitHub</span>github.com/votre-pseudo
        </a>
      </div>
    </div>

    <footer class="footer">
      <p>© <span id="year"></span> Thomas ROBERT <span data-i18n="footer.text">— Engineering student, Arts et Métiers</span></p>
      <a href="index.html#projects" class="footer-top" data-i18n="ui.backToProjects">All projects</a>
    </footer>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/projects-data.js"></script>
  <script src="js/script.js"></script>
  <script src="js/project-page.js"></script>
</body>
</html>
